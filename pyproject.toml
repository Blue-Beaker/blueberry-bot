[project]
name = "blueberry-bot"
version = "0.1.0"
description = "blueberry-bot"
readme = "README.md"
requires-python = ">=3.9, <4.0"
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-adapter-qq>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]

[tool.pytest.ini_options]
# 将 blueberry-bot/blueberry-bot/（含 plugins 包）加入 sys.path，替代各模块内的导入 workaround
pythonpath = ["blueberry-bot"]
testpaths = ["blueberry-bot/plugins"]
asyncio_mode = "auto"
# 所有 async 测试共享同一个 session 级事件循环，
# 避免模块级共享 httpx.AsyncClient(_client) 跨事件循环导致 "Event loop is closed"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
[tool.nonebot]
adapters = [
    { name = "Minecraft", module_name = "nonebot.adapters.minecraft" },
    { name = "Discord", module_name = "nonebot.adapters.discord" },
    {name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"},
    {name = "QQ", module_name = "nonebot.adapters.qq"}
]
plugins = ["nonebot_plugin_apscheduler"]
plugin_dirs = ["blueberry-bot/plugins"]
builtin_plugins = []
